# .github/workflows/tests.yml
#
# Runs the vitest unit suite on every PR into main. This is the gate the repo
# currently lacks: today the only workflow (main.yml) is a Vercel function
# warmer, and the Vercel build runs `vite build` with no test step — so the
# archetype import-boundary ratchet, the identityHash CI lock, and the
# extensionless-import guard are all local-only and can (and did) sit red on
# main unnoticed.
#
# Scope note: the eval configs are deliberately NOT run here — they need
# long-running fixtures. `npm run test:rules` (the Firestore emulator suites:
# every rules denials suite and the setup-evidence store's protocol rows) runs
# in the separate `rules` job at the bottom of this file. It is a separate job
# because it needs a JDK and the emulator download, and so that the `unit`
# job's steps and wall-clock stay exactly as they were: the two jobs have no
# `needs` and run in parallel. The `unit` job is still the fast unit gate.
#
# It also runs the tf-setup golden-baseline guard (the step after Node setup):
# a cross-revision check that blocks a golden regenerated under an unchanged
# semantics id, which the in-revision golden tests cannot see.

name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Comparison base for the tf-setup golden-baseline guard: a branch, tag or SHA that is an earlier ancestor of the ref this run checks out and carries the accepted baseline (for example a commit of main before your change).'
        required: true
        type: string

# A new push to the same PR cancels the previous run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: vitest (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the golden-baseline guard compares against the PR's
          # target-base commit (or the dispatch base_ref), which a depth-1
          # checkout of the PR merge ref does not carry. The checked-out
          # revision itself is unchanged (the PR merge result).
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # No .nvmrc / engines field in the repo — 20 LTS matches Vercel's
          # current default runtime. Bump deliberately, not incidentally.
          node-version: '20'
          cache: 'npm'

      # ── The tf-setup golden-baseline guard (blocking) ────────────────
      # golden.test.js checks one revision against itself, so a golden
      # regenerated under an unchanged SEMANTICS_ID with its baseline entry
      # rewritten to match passes it. This step runs the cross-revision guard
      # (scripts/experiments/tf-setup-golden-baseline-check.mjs, the only
      # authority on the versioning rules) against the PR's immutable
      # target-base SHA, or the required base_ref input on a manual run.
      # It fails closed: the base must be an earlier ancestor that carries
      # the accepted baseline, and an initial-baseline result is a failure.
      # Event values reach the script only through env, never the run text.
      # It needs no dependencies, so it runs before npm ci and fails fast.
      # (scripts/ci/tf-setup-golden-guard.mjs;
      # docs/audits/20261028_TF_SETUP_CI_GOLDEN_GUARD.md)
      - name: Golden baseline guard (tf-setup, cross-revision)
        env:
          TF_GUARD_EVENT_NAME: ${{ github.event_name }}
          TF_GUARD_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TF_GUARD_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TF_GUARD_BASE_REF: ${{ inputs.base_ref }}
        run: node scripts/ci/tf-setup-golden-guard.mjs

      - name: Install dependencies
        run: npm ci

      # Worker count is pinned so CI wall-clock is deterministic: on a 2-vCPU
      # runner vitest's default worker count can resolve to either 2 or 1
      # (availableParallelism() - 1), which is the difference between a ~4 min
      # and a ~9 min run. Drop the flag if you'd rather take the default.
      # NOTE: `--maxWorkers` only. There is no `--minWorkers` in vitest 4 —
      # passing it aborts the run with "CACError: Unknown option `--minWorkers`"
      # (verified against the pinned vitest 4.0.17).
      # ── The interim lint gate ────────────────────────────────────────
      # Two rules, both of which catch a CRASH rather than a style slip:
      #   no-undef                    -> a ReferenceError that unmounts the
      #                                  React tree (the XP modal, A1)
      #   react-hooks/rules-of-hooks  -> React throwing the moment a
      #                                  condition changes between renders
      #                                  (19 sites, A4)
      # Both were at zero on the commit that added this step, which is the
      # condition it was allowed to land under
      # (docs/audits/20260915_BUILD_CRASH_CLASS_A1_A4.md §6-A). Everything
      # else `npm run lint` reports — 873 errors at that commit — is NOT
      # gated; gating on those would mean continue-on-error, which is not a
      # gate. Widen one rule at a time, each time it reaches zero.
      #
      # Runs BEFORE the unit suite on purpose: it takes well under a minute
      # and both defect classes it catches are ones the suite can miss —
      # nothing imported App.jsx until this arc, and a conditional hook only
      # throws on the one render path that flips its condition.
      - name: Lint gate (crash-class rules only)
        run: npm run lint:gate

      - name: Run unit tests
        run: npm run test:run -- --maxWorkers=2
        env:
          # Vitest reports non-TTY progress more usefully in CI.
          CI: 'true'
          # NOTE: no product secrets are required. The two suites that touch
          # EODHD_API_KEY (api/_utils/marketDataCache.test.js:15-25,
          # api/_utils/fetchEarningsCalendarEODHD.test.js:14-54) set the var
          # themselves and stub global.fetch — no real network, no secret.

  # ── Firestore rules + emulator suites ────────────────────────────────
  # Runs `npm run test:rules`: `firebase emulators:exec --only firestore
  # --project demo-tradeseven-rules "vitest run --config
  # vitest.rules.config.mjs"`. The store's protocol rows and every rules
  # denials suite run against a live Firestore emulator, so a rules change or
  # a record store that the unit suite cannot see is checked on every PR.
  #
  # Independent of `unit` (no `needs`): it runs in parallel and the unit job's
  # wall-clock is unchanged.
  #
  # Why it cannot pass without running the suite:
  #   - no Java 21 -> firebase-tools refuses to start the emulator (it requires
  #     Java 21 or newer) and `emulators:exec` exits non-zero before vitest runs;
  #   - an empty or wrong config match -> vitest exits 1 on "No test files
  #     found" (`passWithNoTests` is not set in vitest.rules.config.mjs);
  #   - `emulators:exec` exits with the wrapped command's exit code.
  # There is no `continue-on-error`, no retry and no test filter anywhere in
  # this job.
  #
  # No secret and no real Firebase project: the suite uses the
  # `demo-tradeseven-rules` demo project, which the emulator serves locally.
  # The only network use beyond `npm ci` is the one-time emulator jar download.
  rules:
    name: firestore rules + emulator suites
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Same as the unit job.
          node-version: '20'
          cache: 'npm'

      # firebase-tools 15.x requires Java 21 or newer
      # (node_modules/firebase-tools/lib/emulator/commandUtils.js,
      # MIN_SUPPORTED_JAVA_MAJOR_VERSION). Temurin 21 is set up explicitly
      # rather than relying on what the runner image ships.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # The Firestore emulator jar is downloaded on first use into
      # ~/.cache/firebase/emulators. The key follows the installed
      # firebase-tools version, so a bump of the pin starts a new cache with
      # no hand-edited key. A cache miss (or a cache that cannot be restored)
      # only costs the download time; the CLI fetches whatever jar is absent.
      - name: Cache the Firestore emulator download
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('node_modules/firebase-tools/package.json') }}

      - name: Run the rules and emulator suites
        run: npm run test:rules
        env:
          CI: 'true'

      # On failure only. The emulator writes its debug log to the working
      # directory; a failure before the emulator starts leaves none, so a
      # missing file is a warning and never hides the real failure above.
      - name: Upload the emulator debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-emulator-debug-logs
          path: |
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: warn
          retention-days: 5
